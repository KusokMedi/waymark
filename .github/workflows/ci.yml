name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace app run typecheck
      - run: npm --workspace app run test
      - run: npm --workspace app run build
      - run: npm --workspace website run typecheck
      - run: npm --workspace website run build
      - run: npm run assemble
