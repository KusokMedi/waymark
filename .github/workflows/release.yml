name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release signing is not configured. Refusing to publish an unsigned APK."
            exit 1
          fi

      - name: Reconstruct keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > waymark-release.jks
          cat > keystore.properties <<EOF
          storeFile=waymark-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name artifacts
        id: artifacts
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/waymark-${version}.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.artifacts.outputs.tag }}
          VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" ../release/waymark-*.apk --clobber
          else
            gh release create "$TAG_NAME" \
              ../release/waymark-*.apk \
              --title "Waymark ${VERSION}" \
              --generate-notes
          fi
          gh release view "$TAG_NAME" --json url,assets --jq '{url, assets: [.assets[].name]}'
